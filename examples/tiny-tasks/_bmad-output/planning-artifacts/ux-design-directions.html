<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Tiny Tasks: design directions</title>
<style>body{font:15px system-ui,sans-serif;margin:24px;background:#f6f7f9}.row{display:flex;gap:20px;flex-wrap:wrap}.phone{width:220px;height:420px;border-radius:24px;background:#fff;box-shadow:0 4px 16px rgba(0,0,0,.12);overflow:hidden}.bar{height:64px;color:#fff;padding:24px 16px 0;font-weight:700}.item{margin:12px;padding:12px;border-radius:10px;background:#eef1f5}.btn{margin:16px 12px;padding:12px;border-radius:10px;color:#fff;text-align:center;font-weight:600}</style></head>
<body><h1>Design directions</h1><p>Two options for the Tasks screen.</p><div class="row">
<div class="phone"><div class="bar" style="background:#1f6feb">Today · A</div><div class="item">Buy milk</div><div class="item">Call dentist</div><div class="btn" style="background:#1f6feb">New task</div></div>
<div class="phone"><div class="bar" style="background:#8250df">Today · B</div><div class="item">Buy milk</div><div class="item">Call dentist</div><div class="btn" style="background:#8250df">New task</div></div>
</div></body></html>
