name: pages
# Publishes the site (site/) to GitHub Pages from the repository's default branch.
# One-time setup: Settings → Pages → Build and deployment → Source: GitHub Actions.
on:
  push:
    paths: ['site/**', 'docs/images/**', 'src/modes.js', 'package.json', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    # other branches only build (catching broken links); the default branch publishes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run site
      - if: github.ref_name == github.event.repository.default_branch
        uses: actions/configure-pages@v5
      - if: github.ref_name == github.event.repository.default_branch
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    if: github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
