# madcompany team — who works on this project.
# Edit this, then run: npx madcompany staff
# Each member becomes a Claude Code subagent (.claude/agents/mc-<id>.md)
# with its own identity and memory (.madcompany/agents/<id>/).

project:
  name: My app
  key: APP            # ticket prefix: APP-1, APP-2…

owner: You            # how HQ refers to you
max_parallel: 3       # agents working at the same time (your Claude plan's limits are shared)

# How the project is built (npx madcompany mode <name> to switch):
#   ui          UI-driven: clickable screens first, then logic, release by release
#   mvp         MVP-driven: the thinnest working slice first (APIs, CLIs, bots), release by release
#   ui-mvp      UI-MVP: MVP screens signed off, then the working MVP, release by release
#   brownfield  an existing codebase: scan it, then ship changes in small releases
#   spec        spec-driven: full BMad planning, epic by epic
mode: ui-mvp
main_branch: main     # approved releases are merged here by "npx madcompany ship"

# Your deploy steps. After a release ships, they become a Human help item for you.
deploy:
  # - Push main; Vercel deploys the web app
  # - eas build --platform all && eas submit

# Commands every ticket must pass before review, and again after each merge.
checks:
  # - npm run typecheck
  # - npm run lint
  # - npm test

preview:
  url:                # e.g. http://localhost:4100 (defaults to the integration web port)

ports:
  base: 4100          # integration app uses 4100-4102; agent N uses base + N*10

limits:
  attempts: 3         # a ticket escalates after this many starts
  memory_chars: 8000  # each memory file must stay under this (forces summarising)

allow_push: false     # agents never push unless you set this to true
env_files: [.env, .env.local]   # where HQ checks that keys from Human help were added (never reads values)

# MCP servers and plugins you've added to Claude Code are the team's too (HQ → Tools).
# Read-only MCP tools run without a prompt; tools that push, deploy, pay, delete or
# send, and writes to GitHub, Linear, Stripe, clouds…, go to you as Human help.
tools:
  auto_allow: true    # false: every MCP tool follows your Claude Code permissions
  allow: []           # e.g. [mcp__github__create_pull_request] or a whole server: [mcp__linear]
  human: []           # always yours, e.g. [mcp__supabase__execute_sql]
  assign: {}          # who uses which server, beyond the defaults by role, e.g. { qa: [playwright] }

library:
  sessions: true      # show your Claude Code conversations in HQ → Library
  dirs: []            # extra folders to include in the Library, e.g. [research, design]

# Roles (type:) fill in title, department, domain, default model, permissions and duties:
#   product-manager, ux-designer, ui-designer, architect, web-developer,
#   mobile-developer, backend-developer, database-engineer, data-engineer,
#   qa-engineer, security-engineer, devops-engineer, tech-writer
# Anything you set below (role, domain, model, profile) wins. For a ready-made
# 5, 10 or 20-person company: npx madcompany staff --template small|medium|large
#
# model: opus | sonnet | haiku | fable | inherit, or a full ID like claude-sonnet-5.
# Change it here or in HQ → Team. The lead is your own Claude Code session,
# so its model is whatever that session runs (/model opus, or claude --model opus).
team:
  - id: lead
    role: Tech lead / PM

  - id: maya
    type: ux-designer
    domain: [design system, screens, navigation]
    model: sonnet

  - id: arjun
    type: backend-developer
    domain: [Node API, auth, payments]
    also: [Postgres]
    model: sonnet

  - id: lena
    type: web-developer
    role: Frontend developer
    domain: [Next.js pages, Expo screens]
    model: sonnet

  - id: qa
    type: qa-engineer
    domain: [E2E tests, screenshots, reviews]
    model: sonnet

# People who use HQ besides you (owner | member | viewer). Add them with
# npx madcompany people add <id> --name "Name" --role member, and run
# npx madcompany hq --share so they can sign in.
# people:
#   - id: priya
#     name: Priya
#     role: member
