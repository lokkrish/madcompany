# Local services for Storyfront agents: one Postgres, one database per agent.
# Start: docker compose -f docker-compose.storyfront.yml up -d
# Each agent creates its own database (sf_<id>) from the connection below.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: storyfront
      POSTGRES_PASSWORD: storyfront
      POSTGRES_DB: sf_integration
    ports:
      - "5433:5432"
    volumes:
      - storyfront-pg:/var/lib/postgresql/data
volumes:
  storyfront-pg:
